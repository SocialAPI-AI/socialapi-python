name: Release

# The api repo's CI commits openapi.json on every api release tag. This
# workflow regenerates the SDK from it, runs the tests, and releases when the
# package changed. Nothing here is edited by hand per release.
on:
  push:
    branches: [main]
    paths: [openapi.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write # PyPI trusted publishing

env:
  FIRST_VERSION: 0.5.0
  OASDIFF_VERSION: 1.38.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install oasdiff
        run: |
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin oasdiff

      - name: Generate
        run: bash scripts/generate.sh

      - name: Test
        run: uv run --python 3.11 --with pytest --with-editable . pytest -q

      - name: Next version
        id: version
        run: echo "version=$(bash scripts/next-version.sh "$FIRST_VERSION" src)" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.version != '' && vars.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml
          uv build

      # Publish before committing: if the upload fails nothing is committed,
      # so re-running the workflow retries the same release.
      - name: Publish to PyPI
        if: steps.version.outputs.version != '' && vars.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ vars.PUBLISH }}
        run: bash scripts/commit-release.sh

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report-failure.sh
