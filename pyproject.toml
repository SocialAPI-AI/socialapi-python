[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "socialapi"
# Written by .github/workflows/release.yml on each release.
version = "0.4.0"
description = "Official Python SDK for SocialAPI, generated from the OpenAPI spec"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "SocialAPI", email = "contact@social-api.ai" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "httpx2>=2.0",
    "attrs>=23.1.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://social-api.ai"
Documentation = "https://docs.social-api.ai"
Repository = "https://github.com/SocialAPI-AI/socialapi-python"

[tool.hatch.build.targets.wheel]
packages = ["src/socialapi"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
